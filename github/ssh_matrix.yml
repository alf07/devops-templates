name: Деплой по SSH

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        server: [server1]
        include:
          - server: server1
            server_name: server1
            host: 192.168.0.1
            user: www-data
            ssh_key_secret: SSH_KEY
            deploy_path: /var/www/exemple.ru/

    steps:
      - name: Выбор репозиторий
        uses: actions/checkout@v4

      - name: Настройка SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets[matrix.ssh_key_secret] }}" > ~/.ssh/private_key
          chmod 600 ~/.ssh/private_key
          ssh-keyscan -H ${{ matrix.host }} >> ~/.ssh/known_hosts

      - name: Загрузка файлов с помощью RSYNC
        run: |
          rsync -avz -e "ssh -i ~/.ssh/private_key -o StrictHostKeyChecking=no" \
            --delete \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.nuxt' \
            --exclude='*.log' \
            --exclude='.env' \
            --exclude='uploads' \
            --exclude='vendor' \
            --exclude='storage' \
            --exclude='database' \
            --exclude='public' \
            --exclude='ecosystem.config.cjs' \
            --exclude='package-lock.json' \
            --exclude='package.json' \
            --exclude='tsconfig.json' \
            --exclude='nuxt.config.ts' \
            ./ ${{ matrix.user }}@${{ matrix.host }}:${{ matrix.deploy_path }}

      - name: Выполнение ssh команд
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ matrix.host }}
          username: ${{ matrix.user }}
          key: ${{ secrets[matrix.ssh_key_secret] }}
          script: |
            echo "Переходим в нужную директорию"
            cd ${{ matrix.deploy_path }}
            
            echo "Чистим кеши"
            php artisan config:cache
            php artisan route:cache
            php artisan cache:clear
