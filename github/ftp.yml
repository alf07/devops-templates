name: Деплой по FTP

on:
  push:
    branches:
    - main

jobs:
  deploy:
    runs-on: ubuntu-20.04
    steps:
      - name: Выбор репозитория
        uses: actions/checkout@v4

      - name: Загрузка файлов по ftp
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0-beta
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir:  /var/www/exemple.ru/
          timeout: 3600
          exclude: |
            /git/
            **/.git*
            **/.git*/**
            **/.github*
            **/.github/**
            /node_modules/
            **/node_modules/**
            /vendor/*
            /vendor/
            **/vendor/**
            composer.json
            composer.lock
            ecosystem.config.js
            package.json
            package-lock.json
            vite.config.js
            .env
            
      - name: Выполнение ssh команд
        uses: nekiro/ssh-job@main
        with:
          host: ${{ secrets.FTP_SERVER }}
          password: ${{ secrets.SSH_PASSWORD }}
          user: ${{ secrets.SSH_NAME }}
          command: |
            echo "Общее"
            cd /var/www/exemple.ru/
            
            echo "Nuxt"
            npm run build
            pm2 restart all
            
            echo "Laravel"
            php artisan route:cache
            php artisan cache:clear
